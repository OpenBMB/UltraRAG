name: CI Smoke Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sayhello-build-run:
    name: Sayhello Build and Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv==0.12.0

      - name: Validate dependency lock
        run: |
          uv lock --check
          if grep -Eq 'name = "nvidia-cuda-(cccl|crt|nvcc|nvrtc|runtime|tileiras)"|nvidia-cutlass-dsl-libs-cu13|extra = \["cu13"\]' uv.lock; then
            echo "CUDA 13 runtime/compiler dependency found in uv.lock"
            exit 1
          fi

      - name: Sync Python dependencies
        run: uv sync

      - name: Test client launch configurations
        run: uv run pytest tests/ultrarag -q

      - name: Build sayhello pipeline
        run: uv run ultrarag build examples/experiments/sayhello.yaml

      - name: Run sayhello pipeline
        run: uv run ultrarag run examples/experiments/sayhello.yaml

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  cpu-image-smoke:
    name: CPU Image Runtime and UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base-cpu
          load: true
          tags: ultrarag:cpu-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Node bridge prerequisites and frontend route
        run: |
          docker run --rm --entrypoint sh ultrarag:cpu-smoke -ec '
            node --version
            npx --version
            python -c "from ui.backend.app import create_app; response = create_app().test_client().get(\"/\"); assert response.status_code == 200, response.status_code; assert b\"<html\" in response.data.lower()"
          '

  dependency-resolution:
    name: Resolve unified all-extras environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv==0.12.0

      - name: Verify unified environment
        run: uv sync --frozen --dry-run --no-dev --all-extras
