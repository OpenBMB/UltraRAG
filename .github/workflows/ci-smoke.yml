name: CI Smoke Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sayhello-build-run:
    name: Sayhello Build and Run (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade "pip>=26.2.2" "uv==0.13.7"

      - name: Validate dependency lock
        run: |
          uv lock --check
          if grep -Eq 'name = "nvidia-cuda-(cccl|crt|nvcc|nvrtc|runtime|tileiras)"|nvidia-cutlass-dsl-libs-cu13|extra = \["cu13"\]' uv.lock; then
            echo "CUDA 13 runtime/compiler dependency found in uv.lock"
            exit 1
          fi

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Verify core installation has no MCP packages
        run: uv run --frozen python -c "import importlib.util; assert importlib.util.find_spec('fastmcp') is None; assert importlib.util.find_spec('mcp') is None"

      - name: Build sayhello pipeline without MCP
        run: uv run --frozen ultrarag build examples/experiments/sayhello.yaml --no-mcp

      - name: Run sayhello pipeline without MCP
        run: uv run --frozen ultrarag run examples/experiments/sayhello.yaml --no-mcp

      - name: Sync MCP dependencies
        run: uv sync --frozen --extra mcp

      - name: Test execution parity and regressions
        run: uv run --frozen --extra mcp python -m pytest tests servers/generation/tests servers/retriever/tests -q

      - name: Check core code quality
        run: |
          uv run --frozen --extra mcp ruff check src/ultrarag
          uv run --frozen --extra mcp ruff format --check src/ultrarag

      - name: Build sayhello pipeline with MCP
        run: uv run --frozen --extra mcp ultrarag build examples/experiments/sayhello.yaml

      - name: Run sayhello pipeline with MCP
        run: uv run --frozen --extra mcp ultrarag run examples/experiments/sayhello.yaml

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend behavior
        run: npm test

      - name: Check and build frontend
        run: npm run check

  cpu-image-smoke:
    name: CPU Image Runtime and UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base-cpu
          load: true
          tags: ultrarag:cpu-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify MCP pipelines, Node bridge, and frontend route
        run: |
          docker run --rm --entrypoint sh ultrarag:cpu-smoke -ec '
            node --version
            npx --version
            ultrarag build examples/experiments/sayhello.yaml
            ultrarag run examples/experiments/sayhello.yaml
            ultrarag build examples/experiments/sayhello.yaml --no-mcp
            ultrarag run examples/experiments/sayhello.yaml --no-mcp
            python -c "from ui.backend.app import create_app; response = create_app().test_client().get(\"/\"); assert response.status_code == 200, response.status_code; assert b\"<html\" in response.data.lower()"
          '

  dependency-resolution:
    name: Resolve unified all-extras environment (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade "pip>=26.2.2" "uv==0.13.7"

      - name: Verify unified environment
        run: uv sync --frozen --dry-run --no-dev --all-extras
